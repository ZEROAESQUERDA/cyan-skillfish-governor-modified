# Configuração otimizada para ESTABILIDADE e Boost Escalonável

[timing.intervals]
sample = 2000    # 2ms por amostra
adjust = 250000  # Aumentado para 250ms para transições menos bruscas

[timing.ramp-rates]
normal = 1.0
burst = 50.0

[timing]
burst-samples = 48
down-events = 5

[frequency-thresholds]
adjust = 25

[load-target]
upper = 0.90 # Aumentado para evitar subir para 2000MHz desnecessariamente
lower = 0.50 # Aumentado para evitar quedas bruscas para 1000MHz

[temperature]
throttling = 70
throttling_recovery = 70

# Safe points com margem de segurança extra para evitar travamentos
[[safe-points]]
frequency = 1000
voltage = 750 # Aumentado de 700 para 750 para estabilidade

[[safe-points]]
frequency = 1100
voltage = 760

