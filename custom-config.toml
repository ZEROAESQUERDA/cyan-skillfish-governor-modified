# Configuração otimizada para Boost Escalonável e Controle Térmico

[timing.intervals]
sample = 2000    # 2ms por amostra
adjust = 200000  # 200ms por ciclo de ajuste

[timing.ramp-rates]
normal = 1.0
burst = 50.0

[timing]
burst-samples = 48
down-events = 5

[frequency-thresholds]
adjust = 25

[load-target]
upper = 0.85
lower = 0.40 # Reduzido para permitir cair para 1000MHz em idle/baixa carga

[temperature]
throttling = 70
throttling_recovery = 70

# Safe points cobrindo as frequências de interesse (1000 até 2000) com voltagens otimizadas
